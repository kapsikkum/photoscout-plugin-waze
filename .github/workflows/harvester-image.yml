# Builds the Waze harvester container and publishes it to GitHub Container Registry (GHCR).
#
# Triggers:
#   workflow_dispatch  Run by hand from the Actions tab. Pushes sha-<short> only, never latest.
#   release            A published plugin release also builds the image. Pushes the release tag
#                      (for example v1.1.0) and latest, unless the release is a pre-release.
#   push of a tag      A tag named harvester-v* (for example harvester-v1.2.0) pushes that tag and latest.
#
# The image never contains a Waze APK. harvester/.dockerignore excludes *.apk, *.apkm, *.apks and
# *.xapk, and Dockerfile.emulator copies only named source files, so an APK cannot reach the image.
# Operators supply the APK at run time: a read-only bind mount plus WAZE_APK_PATH.
#
# No emulator runs here. Hosted runners have no /dev/kvm, and the build only assembles the image.
# The image is large (Android SDK and system image); that is expected.

name: harvester-image

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'harvester-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMAGE: ghcr.io/kapsikkum/photoscout-waze-harvester
    steps:
      - name: Free runner disk space
        # The hosted runner has roughly 14 GB free on its root disk. Remove preinstalled toolchains
        # this build never uses. This does not change the image.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Work out image tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "$EVENT" = "release" ]; then
            tags="${tags},${IMAGE}:${RELEASE_TAG}"
            if [ "$PRERELEASE" != "true" ]; then
              tags="${tags},${IMAGE}:latest"
            fi
          elif [ "$EVENT" = "push" ]; then
            tags="${tags},${IMAGE}:${REF_NAME},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags to push: ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the harvester image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./harvester
          file: ./harvester/Dockerfile.emulator
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
